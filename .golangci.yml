# See docs/linting.md for the reproduced failures and maintenance policy.
version: "2"
run:
  relative-path-mode: gomod
  build-tags: [linkname]
  modules-download-mode: readonly
issues:
  fix: false
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: none
  # prealloc changes nil slices; intrange can change bound evaluation.
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - gosec
    - ineffassign
    - lll
    - makezero
    - predeclared
    - revive
    - rowserrcheck
    - staticcheck
    - unused
  settings:
    lll:
      line-length: 120
    gosec:
      excludes:
        - G101
        - G112
      severity: low
      confidence: low
    revive:
      max-open-files: 2048
      confidence: 0.1
      severity: error
      # Review new rules explicitly when upgrading the linter.
      enable-all-rules: false
      rules:
        - name: add-constant
          arguments:
            - allowFloats: 0.0,0.,1.0,1.,2.0,2.
              allowInts: 0,1,2
              allowStrs: '""'
              maxLitCount: "3"
          severity: warning
          disabled: false
        - name: argument-limit
          arguments:
            - 4
          severity: warning
          disabled: false
        - name: atomic
          severity: warning
          disabled: false
        - name: banned-characters
          arguments:
            - Ω
            - Σ
            - σ
            - "7"
          severity: warning
          disabled: false
        - name: bare-return
          severity: warning
          disabled: false
        - name: blank-imports
          severity: warning
          disabled: false
        - name: bool-literal-in-expr
          severity: warning
          disabled: false
        - name: call-to-gc
          severity: warning
          disabled: false
        - name: cognitive-complexity
          arguments:
            - 16
          severity: warning
          disabled: false
        - name: comment-spacings
          arguments:
            - mypragma
            - otherpragma
          severity: warning
          disabled: false
        - name: confusing-naming
          severity: warning
          disabled: false
        - name: confusing-results
          severity: warning
          disabled: false
        - name: constant-logical-expr
          severity: warning
          disabled: false
        - name: context-as-argument
          arguments:
            - allowTypesBefore: '*testing.T,*github.com/user/repo/testing.Harness'
          severity: warning
          disabled: false
        - name: context-keys-type
          severity: warning
          disabled: false
        - name: cyclomatic
          arguments:
            - 24
          severity: warning
          disabled: false
        - name: datarace
          severity: warning
          disabled: false
        - name: deep-exit
          severity: warning
          disabled: false
        - name: defer
          arguments:
            - - call-chain
              - loop
          severity: warning
          disabled: false
        - name: dot-imports
          severity: warning
          disabled: false
        - name: duplicated-imports
          severity: warning
          disabled: false
        - name: early-return
          severity: warning
          disabled: false
        - name: empty-block
          severity: warning
          disabled: false
        - name: empty-lines
          severity: warning
          disabled: false
        - name: error-naming
          severity: warning
          disabled: false
        - name: error-return
          severity: warning
          disabled: false
        - name: error-strings
          severity: warning
          disabled: false
        - name: errorf
          severity: warning
          disabled: false
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          severity: warning
          disabled: false
        - name: file-header
          arguments:
            - This is the text that must appear at the top of source files.
          severity: warning
          disabled: true
        # Boolean mode parameters are established call contracts throughout the
        # simulator; this style rule adds exclusions without finding defects.
        - name: flag-parameter
          severity: warning
          disabled: true
        - name: function-result-limit
          arguments:
            - 2
          severity: warning
          disabled: false
        - name: function-length
          arguments:
            - 42
            - 0
          severity: warning
          disabled: false
        - name: get-return
          severity: warning
          disabled: false
        - name: identical-branches
          severity: warning
          disabled: false
        - name: if-return
          severity: warning
          disabled: false
        - name: increment-decrement
          severity: warning
          disabled: false
        - name: indent-error-flow
          severity: warning
          disabled: false
        - name: imports-blocklist
          arguments:
            - crypto/md5
            - crypto/sha1
          severity: warning
          disabled: false
        - name: import-shadowing
          severity: warning
          disabled: false
        - name: line-length-limit
          arguments:
            - 120
          severity: warning
          disabled: false
        - name: max-public-structs
          arguments:
            - 3
          severity: warning
          disabled: false
        - name: modifies-parameter
          severity: warning
          disabled: false
        - name: modifies-value-receiver
          severity: warning
          disabled: false
        - name: nested-structs
          severity: warning
          disabled: false
        # Preserve evaluation order and declared parameter/receiver names.
        - name: optimize-operands-order
          severity: warning
          disabled: true
        - name: package-comments
          severity: warning
          disabled: false
        - name: range
          severity: warning
          disabled: false
        - name: range-val-in-closure
          severity: warning
          disabled: false
        - name: range-val-address
          severity: warning
          disabled: false
        - name: receiver-naming
          severity: warning
          disabled: false
        - name: redefines-builtin-id
          severity: warning
          disabled: false
        - name: string-of-int
          severity: warning
          disabled: false
        - name: string-format
          arguments:
            - - core.WriteError[1].Message
              - /^([^A-Z]|$)/
              - must not start with a capital letter
            - - fmt.Errorf[0]
              - /(^|[^\.!?])$/
              - must not end in punctuation
            - - panic
              - /^[^\n]*$/
              - must not contain line breaks
          severity: warning
          disabled: false
        - name: struct-tag
          arguments:
            - json,inline
            - bson,outline,gnu
          severity: warning
          disabled: false
        - name: superfluous-else
          severity: warning
          disabled: false
        - name: time-equal
          severity: warning
          disabled: false
        - name: time-naming
          severity: warning
          disabled: false
        - name: var-naming
          arguments:
            - - ID
            - - VM
          severity: warning
          disabled: false
        - name: var-declaration
          severity: warning
          disabled: false
        - name: unconditional-recursion
          severity: warning
          disabled: false
        - name: unexported-naming
          severity: warning
          disabled: false
        - name: unexported-return
          severity: warning
          disabled: false
        - name: unhandled-error
          arguments:
            - fmt.Printf
            - myFunction
          severity: warning
          disabled: false
        - name: unnecessary-stmt
          severity: warning
          disabled: false
        - name: unreachable-code
          severity: warning
          disabled: false
        # Preserve evaluation order and declared parameter/receiver names.
        - name: unused-parameter
          severity: warning
          disabled: true
        # Preserve evaluation order and declared parameter/receiver names.
        - name: unused-receiver
          severity: warning
          disabled: true
        - name: useless-break
          severity: warning
          disabled: false
        - name: waitgroup-by-value
          severity: warning
          disabled: false
    staticcheck:
      checks:
        - -SA2002
        - -ST1003
        - S1002
        - S1004
        - S1007
        - S1009
        - S1010
        - S1012
        - S1019
        - S1020
        - S1021
        - S1024
        - S1030
        - SA2*
        - SA3*
        - SA4009
        - SA5*
        - SA6000
        - SA6001
        - SA6005
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Preserve contract-owned symbols, loop semantics and byte-sensitive
      # formatting. Bug/security checks and revive complexity checks stay active.
      - path: '^(internal/(compat/(go[0-9]+|selected|spec)|hostabi|buildspec)|rt/runtime)/'
        linters: [lll, predeclared, unused, copyloopvar]
      # Suppress only revive's naming conventions in contract-owned sources.
      - path: '^(internal/(compat/(go[0-9]+|selected|spec)|hostabi|buildspec)|rt/runtime)/'
        linters: [revive]
        text: '^(banned-characters|confusing-naming|error-naming|exported|import-shadowing|receiver-naming|redefines-builtin-id|time-naming|unexported-naming|var-naming):'
      # Fixed argument/result order, receiver types and ABI layouts take
      # precedence over API-design conventions.
      - path: '^(internal/(compat/(go[0-9]+|selected|spec)|hostabi|buildspec)|rt/runtime)/'
        linters: [revive]
        text: '^(argument-limit|confusing-results|context-as-argument|error-return|flag-parameter|function-result-limit|get-return|modifies-value-receiver|nested-structs|unexported-return):'
      # Bare-return rewrites only change style but invalidate adapter hashes.
      # Match the lll and formatter exclusions without hiding complexity.
      - path: '^(internal/(compat/(go[0-9]+|selected|spec)|hostabi|buildspec)|rt/runtime)/'
        linters: [revive]
        text: '^(bare-return|line-length-limit):'
      # These lines are literal Go source templates. Reflow changes generated
      # adapter bytes and their versioned fingerprints.
      - path: '^internal/routegen/(adapter_body|dispatch|render)\.go$'
        linters: [lll]
      # Callback results are captured in named return values by these control
      # adapters; preserve their existing declarations and return shape.
      - path: '^(internal/kernel/control_(fs|net)|metatesting/metatest)\.go$'
        linters: [revive]
        text: '^bare-return:'
      # These packages define the public ABI and translated service contracts.
      # Splitting declarations to satisfy a per-file struct quota only churns
      # versioned source identities without changing the exposed API.
      - path: '^(internal/(buildspec|compat|contracts)/|rt/runtime/)'
        linters: [revive]
        text: '^max-public-structs:'
      # Public controls, model schemas and manifests legitimately declare more
      # than three exported structs in a file. Preserve their API grouping.
      - path: '^((fs|net|nemesis|metatesting)/|[^/]+\.go$|internal/(fs/model|net/model|kernel|translate|gosimtool|gosimlog)/)'
        linters: [revive]
        text: '^max-public-structs:'
      # The runtime driver is the test-process entry point, even though its
      # entry function is intentionally named differently from main.
      - path: '^rt/runtime/driver_main\.go$'
        linters: [revive]
        text: '^deep-exit:'
      # The profile generator is a CLI, and the testing shim retains Go's
      # process-exit behavior for invalid test flags.
      - path: '^internal/compat/(genprofile/main|go125/shims/testing/match)\.go$'
        linters: [revive]
        text: '^deep-exit:'
      # Provider and control methods implement the contracts package's fixed
      # interfaces. Grouping arguments or results would break dispatch.
      - path: '^internal/(fs/ops|net/ops|kernel/control_[a-z]+)\.go$'
        linters: [revive]
        text: '^(argument-limit|function-result-limit):'
      # Identity inputs are an explicit digest contract; collapsing them into
      # an opaque argument bundle makes accidental omissions easier.
      - path: '^internal/buildcfg/identity\.go$'
        linters: [revive]
        text: '^argument-limit:'
      # These result and flag positions are part of existing public or provider
      # method signatures, including the paired native/sim recovery API.
      - path: '^(fs/recovery_native|internal/(fs/control|net/control|gosimtool/gosimtool))\.go$'
        linters: [revive]
        text: '^(function-result-limit|flag-parameter):'
      # These array lengths encode Linux IPv4, the self-exit transport tuple,
      # and the copied TLS ticket-key signature; naming a constant in a type
      # would churn fixed ABI declarations without adding a useful check.
      - path: '^internal/(kernel/(control_net|kernel|machine)|net/(control|model/net)|compat/go125/shims/tls/tls)\.go$'
        linters: [revive]
        text: '^add-constant:'
      # Native stubs share these handle layouts with simulation-only methods;
      # the run IDs are read under the sim build tag.
      - path: '^fs/recovery\.go$'
        linters: [unused]
      # Diagnostic strings begin with proper names used by callers and reports;
      # changing them would alter observable error text without improving style.
      - path: '^internal/(buildcfg/toolchain|buildspec/family|routegen/layouts|workerboot/cache)\.go$'
        linters: [revive]
        text: '^error-strings:'
      # Equality is evaluated for its comparability panic, matching sync.Map
      # even before the translated map has allocated storage.
      - path: '^internal/compat/go125/shims/syncmap/map\.go$'
        linters: [revive]
        text: '^constant-logical-expr:'
      # These copied Go shims and deterministic scheduler paths have fixed
      # upstream/replay structure; extracting branches adds source churn only.
      - path: '^(internal/compat/go125/shims/(reflect/deepequal|testing/(match|testing))|rt/runtime/(driver_main|globals|map|runtime))\.go$'
        linters: [revive]
        text: '^(cognitive-complexity|cyclomatic|function-length):'
    paths:
      - '_test\.go$'
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/neria-cloud/gosim]
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # Also honored by make fmt; source identities need deliberate regeneration.
      - '^(internal/(compat/(go[0-9]+|selected|spec)|hostabi|buildspec)|rt/runtime)/'
