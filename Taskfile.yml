version: '3'

output: prefixed

vars:
  # GOSIM: go run github.com/neria-cloud/gosim/cmd/gosim
  GOSIM: $(pwd)/.gosim/gosimtool
  SIMPACKAGES: ./internal/tests/rt ./internal/tests/fs ./internal/tests/net ./internal/tests/integration ./nemesis ./examples

tasks:
  fix-fmt:
    cmds:
      - .ci/gofmt fix

  check-fmt:
    cmds:
      - .ci/gofmt check

  go-generate:
    cmds:
      - go generate ./...

  gosim-tool:
    run: once
    cmds:
      - mkdir -p ./.gosim && go build -ldflags=-checklinkname=0 -tags=linkname -o ./.gosim/gosimtool ./cmd/gosim

  gosim-prepare-selftest:
    run: once
    cmds:
      - "{{.GOSIM}} internal-candidate prepare-selftest"
    deps:
      - gosim-tool

  go-test:
    env:
      GOSIMTOOL: "{{.USER_WORKING_DIR}}/.gosim/scripttest/bin/gosim"
    cmds:
      - "{{.GOSIM}} internal-candidate build-tests {{.SIMPACKAGES}}"
      - go test -ldflags=-checklinkname=0 -tags=linkname ./...
    deps:
      - gosim-tool
      - gosim-prepare-selftest

  go-race-test:
    env:
      GOSIMTOOL: "{{.USER_WORKING_DIR}}/.gosim/scripttest/bin/gosim"
    cmds:
      - "{{.GOSIM}} internal-candidate build-tests -race {{.SIMPACKAGES}} ./internal/tests/race/testdata"
      # todo: get rid of this janky thing???
      - go test -ldflags=-checklinkname=0 -tags=linkname -race ./...
    deps:
      - gosim-tool
      - gosim-prepare-selftest

  test:
    cmds:
      - ./test.sh --concurrency 1
