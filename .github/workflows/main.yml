name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.25.x', '1.26.x']
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.toolchain }}
          check-latest: false
      - name: Native compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev python3
      - name: Format and reporting checks
        run: |
          ./.ci/gofmt check
          make test-report-tools
      - name: Run ordinary native and simulation tests
        run: make test
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-ubuntu-24.04-arm-${{ matrix.toolchain }}
          path: test-reports/unit/
          if-no-files-found: error
